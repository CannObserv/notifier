[project]
name = "notifier-client"
version = "0.3.2"
description = "Async Python SDK for the notifier service. Generated from notifier's OpenAPI schema; versioned in lockstep with the server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.2,<3",        # the locked, tested version; 2.16.1's _types regression never reached the SDK
    # Spans two majors deliberately, unlike the service's >=4.0.1 (#45).
    # idempotency.py only ever calls str(ULID()), which 4.0 left untouched
    # — it removed ValueProvider and ULID.provider — so a consumer already
    # holding ulid at 3.x is not forced through a major to install this.
    "python-ulid>=3.0.0,<5",
    "attrs>=24,<27",             # required by openapi-python-client output
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "respx>=0.23.1,<0.24",
    "openapi-python-client>=0.29.1,<0.31",
    "ruff>=0.17.1,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:respx: respx's entry-point plugin imports httpx before conftest can
# alias it to httpx2; tests/conftest.py registers the plugin itself, after.
addopts = "-v --tb=short -m 'not integration' -p no:respx"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that hit a live notifier; excluded by default (run with -m integration)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/notifier_client/generated/"]   # generated code — don't lint

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["notifier_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier_client"]
