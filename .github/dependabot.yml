# Proposes the bumps the 0.x cap policy makes invisible to `uv lock` (#33).
# Every cap sits one minor below a wall by design (#30): crossing it takes a
# reviewed diff, and this file is what produces that diff instead of a memory.
# Each PR is gated by ci.yml — `uv sync --locked` proves the lock resolves,
# the suite proves nothing broke, tests/ci/test_dependencies.py proves the
# rewritten specifier still obeys the policy — and this file is itself
# guarded by tests/ci/test_dependabot.py, because a mistyped config stops
# producing PRs without erroring anywhere a person looks.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/" # the service's table
      - "/clients/python" # the SDK's — published, so exactly as exposed (#30)
    schedule:
      interval: "weekly"
    # Pinned because the default `auto` resolves to `widen` for libraries —
    # the SDK is one — and `widen` is unsupported for uv (dependabot-core#15290).
    # It does not keep floors still: under uv, #52–#54 raised the floor on
    # in-range bumps all the same (#103). Harmless in the service's table,
    # where the floor is the tested version; in the SDK's it narrows what a
    # consumer may install, so check an SDK PR's floor before merging it.
    versioning-strategy: increase-if-necessary
    # The default is 5, and past it dependabot opens nothing and says so
    # nowhere. #51–#55 filled it and the dev-tools group and the SDK table
    # went silent for five weeks (#103). Above every runtime PR plus every
    # group PR at once; tests/ci/test_dependabot.py derives that bound.
    open-pull-requests-limit: 25
    groups:
      # Dev tooling carries most of the churn (ruff alone ships minors
      # roughly monthly); one grouped PR per directory keeps the bot
      # readable. Runtime dependencies stay individual PRs — a fastapi or
      # apprise bump deserves its own review.
      dev-tools:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
