# The repo's clean-runner correctness gate. Until this landed, every green
# result notifier ever reported came from a human or an agent choosing to run
# the suite: `.github/workflows/` held one PR-triggered workflow, and this
# repo commits straight to main, so it had never executed once (#27).
#
# `pre-commit` is not a substitute — it runs ruff and nothing else.
#
# The local-gate attestation (#182, gregoryfoster/skills#688). With
# .skills/attest-local-gate committed as `on`, shipping-work's push.sh runs
# the local gate (scripts/pre-ship.sh) on the exact tree, pushes, and posts
# the commit status `gate/local` = success on that SHA. The `attest` job reads
# it, and `test` is skipped for an attested push or a person's PR. So a green
# run on such a commit did not run pytest here: the local gate did, and the
# daily schedule re-runs everything on a clean runner. `gate/local` is trust,
# not proof — anyone with push access can post it — so it is never a required
# status on its own; require the jobs that read it.
#
# Never skipped: `lint`, and `migrations`, which the local gate never runs
# (it runs ruff and pytest; conftest builds schema with create_all). Nor is
# `test` skipped for a schedule, a manual run, a tag, a bot's PR or a fork's.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily, always the full tier: the only clean-runner test run an attested,
  # directly shipped commit gets. Off the hour, where GitHub queues scheduled
  # runs late, and off audit.yml's 23 13. GitHub mails a failed scheduled run
  # to whoever last edited this cron line.
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Supersede PR runs; never cancel a run on main. On this single-VM setup
  # main is the deployed code, so cancelling costs that commit its only signal.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  statuses: read # the attest job reads the combined status; unlisted keys are none

jobs:
  lint:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. These jobs finish in under a minute, so
    # anything past this is wedged — a hung `uv sync`, or a postgres that never
    # comes up — and should stop burning runner time rather than sit there.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Two steps, not one: a red run should say whether it was a lint
      # violation or a formatting one without anyone opening the log.
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  attest:
    # One API call, no checkout: did push.sh attest this commit's local gate?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attested: ${{ steps.read.outputs.attested }}
    steps:
      - name: Read gate/local on the head commit
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          # The PR's head. On pull_request, github.sha is the merge commit,
          # which nobody gated.
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The combined status keeps each context's latest state; /statuses
          # lists every status ever posted, so a later failure would still
          # count. A page is 30 contexts unless more are asked for. A refused
          # read fails this job: loud, and `test` then runs (see its if:).
          n=$(gh api "repos/${{ github.repository }}/commits/$HEAD/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "gate/local" and .state == "success")] | length')
          echo "attested=$([ "$n" -gt 0 ] && echo yes || echo no)" >>"$GITHUB_OUTPUT"
          echo "gate/local = success on $HEAD: $([ "$n" -gt 0 ] && echo yes || echo no)"

  test:
    needs: attest
    # Skipped only for an attested commit, on a branch push or a pull request,
    # and never for a bot's PR or a fork's: neither came from a local gate.
    # Job level, so a skip never starts the Postgres container (~21s of the
    # job). `!cancelled()` replaces the implicit success(): a failed attest
    # read leaves `attested` unset, and the suite runs. Every line at one
    # indent, so `>-` folds the condition to one line: a more-indented line
    # keeps its newline (auditing-ci-cost traps.md #7).
    if: >-
      !cancelled() && (
      needs.attest.outputs.attested != 'yes'
      || (github.event_name != 'push' && github.event_name != 'pull_request')
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'pull_request'
      && (github.event.pull_request.user.type == 'Bot'
      || github.event.pull_request.head.repo.full_name != github.repository))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notifier
          POSTGRES_PASSWORD: notifier
          # The _test suffix is load-bearing, not cosmetic. src/core/db_safety.py
          # classifies a database by the suffix of its *name*, and
          # get_database_url() is the chokepoint every connection crosses. A
          # container named `notifier` fails the whole suite at fixture setup
          # with a production-refusal error that reads nothing like a typo.
          POSTGRES_DB: notifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifier"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://notifier:notifier@localhost:5432/notifier_test
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags. The default (fetch-depth: 1) fetches
          # neither, and tests/ci/test_release_tags.py would then find no tag,
          # find no HEAD~1 to compare against, and pass vacuously — the gate
          # silently stops being one. The test refuses a shallow checkout
          # rather than reporting green; this is what keeps it from having to.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned because [tool.coverage.run] core = "sysmon" needs CPython
          # >= 3.12. An older interpreter falls back to the default trace core
          # *silently* and reports ~6 points low — against the live
          # fail_under = 80 that is a quiet near-miss, not a loud failure.
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # No -m and no --cov here: both live in [tool.pytest.ini_options]
      # addopts. A second spelling on the command line overrides rather than
      # composes, and gives the marker expression somewhere to drift.
      # NOTIFIER_SECRET_KEY is not needed — conftest generates a throwaway one.
      - name: Run tests
        run: uv run pytest

  migrations:
    # The one gate the test suite structurally cannot be. tests/conftest.py
    # builds schema with Base.metadata.create_all, so a broken migration chain
    # never surfaces in pytest — it surfaces on deploy. The local gate never
    # runs alembic either, so an attestation never skips this job (#182).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notifier
          POSTGRES_PASSWORD: notifier
          # Deliberately its own database, and empty. Reusing the test job's
          # would work until create_all ran first, then fail `upgrade head`
          # on "relation already exists".
          POSTGRES_DB: notifier_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifier"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # No NOTIFIER_ALLOW_PROD_DB. alembic/env.py reads os.environ directly and
      # never calls the guard — a documented carve-out, not an oversight.
      DATABASE_URL: postgresql+asyncpg://notifier:notifier@localhost:5432/notifier_migrations_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Migrate an empty database from scratch
        run: uv run alembic upgrade head
      - name: Fail on model/migration drift
        run: uv run alembic check
