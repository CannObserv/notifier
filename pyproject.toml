[project]
name = "notifier"
version = "0.3.1"
description = "Multi-tenant notifications service: Apprise-backed dispatcher with Jinja2 templates and JSON-Schema-validated variable bags."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.137",
    # Every model in src/api/schemas/ imports it. Arrived transitively via
    # fastapi (>=2.9.0) until #32 — a floor for our own code set by someone
    # else's packaging.
    "pydantic>=2.13.4,<3",
    "python-json-logger>=4.0.0,<5",
    "uvicorn>=0.52.4,<0.53",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30.0,<0.32",
    "alembic>=1.19.1,<2",
    "python-ulid>=4.0.1,<5",
    "httpx>=0.28.0,<0.29",
    "jinja2>=3.1.6,<4",
    "jsonschema>=4.21.0,<5",
    "apprise>=1.9.9,<2",
    "cryptography>=46.0.6,<48",
    "mistune>=3.3.4,<4",
    "referencing>=0.37.0,<0.38",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2,<5",
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    # tests/ci/ parses pyproject.toml's own specifiers (#30). Present
    # transitively, but declared here because the tests import it directly.
    "packaging>=26.3,<27",
    # tests/ci/ parses .github/workflows/*.yml. Available transitively via
    # pre-commit, but declared here because the tests import it directly.
    "pyyaml>=6.0,<7",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration' --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that hit live external services; excluded by default (run with -m integration)",
]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 formats Python blocks inside Markdown, so skills/ came into scope.
# It does not descend into symlinked *directories*, so the 20 whole-skill links
# into skills-vendor/ are already skipped; only file-level symlinks — what
# managing-skills creates when a local override shadows part of a skill — are
# read, and they dangle wherever the submodules are not checked out, which is
# every CI job but context-cadence. Excluding the one that exists rather than
# all of skills/, so the committed SKILL.md overrides stay formatted. A new
# file symlink here fails loudly, naming its own path (#45).
# docs/plans/ are dated snapshots of what was proposed, not maintained
# source; reformatting their code samples rewrites the record.
extend-exclude = [
    "skills-vendor/",
    "skills/brainstorming/visual-companion.md",
    "alembic/versions/",
    "docs/plans/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
# The default trace core under-reports async function bodies: it credited
# src/api/routes/dispatch.py with 64% while a deliberate `raise` proved the
# handler ran end to end, and the whole suite read 87% against a true 93%.
# Gating on fail_under with a core that miscounts async code — most of this
# codebase — measures the tracer, not the tests.
#
# Requires CPython >= 3.12 (this project's floor) and coverage >= 7.10. A
# runner on an older interpreter silently falls back to the default core and
# reports ~6 points low across the suite, so CI must match (see issue #27).
core = "sysmon"

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
