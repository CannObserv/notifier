# Local hooks only. Every entry shells out to `uv run`, so the hooks use the
# exact tool versions pinned in uv.lock — the same ruff the CI lint job, the
# ship gate, and the review gate all use. No pinned hook revs to drift out of
# sync, and no network needed to bootstrap a clone.
#
# These hooks do not run pytest. CI does (.github/workflows/ci.yml), and so
# does the ship gate (`scripts/pre-ship.sh`, which execs the vendored one in
# the shipping-work skill). A green pre-commit proves style plus
# the one config invariant ruff cannot see locally, not correctness.
#
# Every hook is read-only: it reports violations rather than rewriting files
# mid-commit. Fix with `uv run ruff format .` / `uv run ruff check --fix .`.
#
# Install once per clone: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        # Every hook is repo-wide (pass_filenames: false), so this pattern is
        # purely a trigger. It must include pyproject.toml: a `[tool.ruff]`
        # change invalidates the formatting of the whole tree, so that is the
        # one commit that most needs a re-check.
        files: '(\.pyi?$|(^|/)pyproject\.toml$)'
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        # `.md` here alone: ruff 0.16 formats Python blocks inside Markdown,
        # which `ruff check` never reads (#124).
        files: '(\.(pyi?|md)$|(^|/)pyproject\.toml$)'
        pass_filenames: false

      # The one non-ruff hook (#126). A file symlink into skills-vendor/
      # resolves here and dangles in CI, so ruff passes locally on exactly the
      # commit that turns lint red on main (#45, #124). The script reads the
      # git index and needs no database; tests/ci/test_ruff_exclude.py runs it
      # again in CI. types_or, not files: a link's name is arbitrary and
      # pre-commit ANDs files with the tag filters, so only tags can say "a
      # staged symlink, or pyproject.toml" (the commit that drops an exclude).
      # `types: []` is load-bearing: the default is [file], and a link's tags
      # are {symlink} alone, so the default skips every link silently.
      - id: ruff-exclude-symlinks
        name: ruff extend-exclude covers file symlinks
        entry: uv run python scripts/check_ruff_exclude.py
        language: system
        types: []
        types_or: [symlink, toml]
        pass_filenames: false
